<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Store - Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>

  <div class="ceiling-slab"></div>

  <ul class="sculptural-links">
    <li>
      <span class="wire"></span>
      <a href="index.html" class="nav-item">
        <span class="label">HOME</span>
        <div class="shape sphere"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="category.html" class="nav-item">
        <span class="label">SHOP</span>

    <li>
      <span class="wire"></span>
      <a href="contact.html" class="nav-item">

      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="category.html" class="nav-item">
        <span class="label">CATEGORY</span>
        <div class="shape pyramid-alt"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="cart.html" class="nav-item">
        <span class="label">CART</span>
        <div class="shape sphere-alt"></div>
      </a>
    </li>
  </ul>

  <div class="brand-plate-assembly">
    <span class="anchor-wire wire-left"></span>
    <span class="anchor-wire wire-right"></span>
    <div class="brand-plate">
      <h1 class="logo">STYLE STORE</h1>

</header>

  </nav>

  <section id="cart">
    <h2 class="title">Your Cart</h2>
    <div id="cart-list"></div>

  <script src="script.js"></script>
