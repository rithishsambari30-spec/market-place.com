<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Store - Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav-installation">
    <div class="ceiling-slab"></div>
    <ul class="sculptural-links">
      <li>
        <span class="wire"></span>
        <a href="index.html" class="nav-item">
          <span class="label">HOME</span>
          <div class="shape sphere"></div>
        </a>
      </li>
      <li>
        <span class="wire"></span>
        <a href="category.html" class="nav-item">
          <span class="label">SHOP</span>
          <div class="shape cube"></div>
        </a>
      </li>
      <li>
        <span class="wire"></span>
        <a href="contact.html" class="nav-item active">
          <span class="label">CONTACT</span>
          <div class="shape pyramid"></div>
        </a>
      </li>
      <li>
        <span class="wire"></span>
        <a href="category.html" class="nav-item">
          <span class="label">CATEGORY</span>
          <div class="shape pyramid-alt"></div>
        </a>
      </li>
      <li>
        <span class="wire"></span>
        <a href="cart.html" class="nav-item">
          <span class="label">CART</span>
          <div class="shape sphere-alt"></div>
        </a>
      </li>
    </ul>
  </header>

  <main class="contact-page">
    <section class="contact-hero">
      <div class="contact-copy">
        <span class="eyebrow">Let's Connect</span>
        <h1>We're here to help and answer any question you might have.</h1>
        <div class="contact-cards">
          <article class="info-card">
            <span class="info-icon">📧</span>
            <h3>Email Us</h3>
            <p><a href="https://rithish.com" target="_blank">support@stylestore.com</a></p>
          </article>
          <article class="info-card">
            <span class="info-icon">📞</span>
            <h3>Call Us</h3>
            <p>+91 7386066008</p>
          </article>
          <article class="info-card">
            <span class="info-icon">📍</span>
            <h3>Follow Us</h3>
            <p>vinish_41_</p>
          </article>
        </div>
      </div>

      <aside class="contact-form-card">
        <div class="form-heading">
          <p class="form-subtitle">Send us a Message</p>
        </div>
        <form class="contact-form" action="#" method="post">
          <label>
            <span>Your Name</span>
            <input type="text" name="name" placeholder="Your Name" required>
          </label>
          <label>
            <span>Your Email</span>
            <input type="email" name="email" placeholder="Your Email" required>
          </label>
          <label>
            <span>Subject</span>
            <input type="text" name="subject" placeholder="Subject">
          </label>
          <label>
            <span>Your Message</span>
            <textarea name="message" placeholder="Your Message" required></textarea>
          </label>
          <button type="submit">SEND MESSAGE</button>
        </form>
      </aside>
    </section>
  </main>
</body>
</html>
