<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STYLE STORE - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin:0; font-family:Arial, sans-serif; }
    .sidebar {
      width:220px; background:#171717; color:white; height:100vh; position:fixed;
      top:0; left:0; padding:20px;
    }
    .sidebar h2 { color:#0083fd; margin-bottom:20px; }
    .sidebar a { display:block; color:white; padding:10px; text-decoration:none; margin:5px 0; }
    .sidebar a:hover { background:#0083fd; border-radius:5px; }
    .main { margin-left:240px; padding:30px; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { border:1px solid #ddd; padding:10px; text-align:center; }
    th { background:#171717; color:white; }
    button { padding:6px 12px; margin:2px; cursor:pointer; }
    .form-section { margin-top:30px; }
    input { padding:8px; margin:5px; width:250px; }
    .login-screen {
      display:flex; justify-content:center; align-items:center;
      height:100vh; background:#f5f6fa;
    }
    .login-box {
      background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);
      text-align:center;
    }
    .login-box input { width:200px; padding:10px; margin:10px 0; }
    /* Modal Styles */
    .modal {
      display:none; position:fixed; z-index:1; left:0; top:0;
      width:100%; height:100%; background-color:rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color:#fefefe; margin:15% auto; padding:20px;
      border:1px solid #888; width:400px; border-radius:8px;
    }
    .modal-content h3 { margin-top:0; }
    .modal input { width:100%; padding:8px; margin:8px 0; box-sizing:border-box; }
    .modal-buttons { text-align:right; margin-top:20px; }
    .modal-buttons button { margin-left:10px; }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login" class="login-screen">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Enter Password">
      <br>
      <button onclick="checkLogin()">Login</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="panel" style="display:none;">
    <div class="sidebar">
      <h2>STYLE STORE</h2>
      <a href="#">Dashboard</a>
      <a href="#">Products</a>
      <a href="#">Categories</a>
      <a href="#">Orders</a>
      <a href="#">Customers</a>
      <a href="#">Settings</a>
      <a href="#">Logout</a>
    </div>

    <div class="main">
      <h2>Manage Products</h2>
      <table id="product-table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Image</th><th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="form-section">
        <h3>Add New Product</h3>
        <input type="text" id="name" placeholder="Product Name"><br>
        <input type="number" id="price" placeholder="Price"><br>
        <input type="text" id="image" placeholder="Image filename (from images folder)"><br>
        <button onclick="addProduct()">Add Product</button>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3>Edit Product</h3>
        <input type="hidden" id="editId">
        <label>Product Name:</label>
        <input type="text" id="editName" placeholder="Product Name"><br>
        <label>Price:</label>
        <input type="number" id="editPrice" placeholder="Price"><br>
        <label>Image Filename:</label>
        <input type="text" id="editImage" placeholder="Image filename"><br>
        <div class="modal-buttons">
          <button onclick="closeEditModal()">Cancel</button>
          <button onclick="saveEdit()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
