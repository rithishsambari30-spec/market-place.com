<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Store - Categories</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <h1>STYLE STORE</h1>
    <header class="nav-installation">
  <div class="ceiling-slab"></div>

  <ul class="sculptural-links">
    <li>
      <span class="wire"></span>
      <a href="index.html" class="nav-item">
        <span class="label">HOME</span>
        <div class="shape sphere"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="category.html" class="nav-item">
        <span class="label">SHOP</span>
        <div class="shape cube"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="contact.html" class="nav-item">
        <span class="label">CONTACT</span>
        <div class="shape pyramid"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="category.html" class="nav-item">
        <span class="label">CATEGORY</span>
        <div class="shape pyramid-alt"></div>
      </a>
    </li>
    <li>
      <span class="wire"></span>
      <a href="cart.html" class="nav-item">
        <span class="label">CART</span>
        <div class="shape sphere-alt"></div>
      </a>
    </li>
  </ul>

  <div class="brand-plate-assembly">
    <span class="anchor-wire wire-left"></span>
    <span class="anchor-wire wire-right"></span>
    <div class="brand-plate">
      <h1 class="logo">STYLE STORE</h1>
    </div>
  </div>
</header>

  </nav>

  <section id="category">
    <h2 class="title">All Categories</h2>
    <div class="category-layout">
      <div class="left-menu">
        <a href="#">Shirts</a>
        <a href="#">Dresses</a>
        <a href="#">Jeans</a>
        <a href="#">Hoodies</a>
        <a href="#">Shoes</a>
        <a href="#">Kids</a>
      </div>
      <div class="right-products" id="product-list"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
